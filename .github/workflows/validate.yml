name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run Ruff
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run tests
        run: pytest
      - name: Check Home Assistant 2026.11 compatibility
        # The current pytest fixture package pins HA 2026.10.4. Exercise the
        # native 2026.11 flow APIs in a clean runtime without those fixtures.
        run: |
          python -m venv "$RUNNER_TEMP/discovery-ha11"
          "$RUNNER_TEMP/discovery-ha11/bin/python" -m pip install homeassistant==2026.11.2 home-assistant-frontend==20261028.6
          "$RUNNER_TEMP/discovery-ha11/bin/python" -m tests.ha_compatibility

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
