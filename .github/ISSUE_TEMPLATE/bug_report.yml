name: Bug report
description: Report an issue with Discovery Monitor
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Discovery Monitor version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Remove credentials, tokens, and other sensitive discovery data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
